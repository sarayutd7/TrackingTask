<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin — TrackingTask</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=20260705-1">
<style>
  @keyframes auroraShimmer { 0%{background-position:0% 0%} 100%{background-position:300% 0%} }

  body {
    margin: 0;
    background: #0f1117;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  .adm-shell { display: flex; flex-direction: column; min-height: 100vh; }

  /* Stats */
  .adm-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .adm-stat {
    background: rgba(99,102,241,0.055);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px; padding: 1rem 1.1rem;
    display: flex; align-items: center; gap: .75rem;
    transition: border-color .2s;
  }
  .adm-stat:hover { border-color: rgba(99,102,241,0.3); }
  .adm-stat-icon {
    width: 40px; height: 40px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .adm-stat-num { font-size: 1.5rem; font-weight: 800; line-height: 1; color: #f1f5f9; }
  .adm-stat-label { font-size: .72rem; color: #94a3b8; margin-top: 3px; }

  /* Toolbar */
  .adm-toolbar {
    display: flex; align-items: center; gap: .6rem;
    padding: 16px 24px 12px; flex-wrap: wrap;
  }
  .adm-search-wrap {
    flex: 1; min-width: 180px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(99,102,241,0.06);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 10px 14px;
    transition: border-color .2s;
  }
  .adm-search-wrap:focus-within { border-color: rgba(99,102,241,0.4); }
  .adm-search-wrap svg { color: #475569; flex-shrink: 0; }
  .adm-search-input {
    background: none; border: none; outline: none;
    color: #f1f5f9; font-size: .85rem; width: 100%;
  }
  .adm-search-input::placeholder { color: #475569; }

  /* User cards */
  .adm-user-card {
    background: rgba(99,102,241,0.055);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px; padding: 1rem 1.2rem;
    transition: border-color .2s;
  }
  .adm-user-card:hover { border-color: rgba(99,102,241,0.25); }
  .adm-user-top { display: flex; align-items: flex-start; gap: .75rem; }
  .adm-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }
  .adm-user-info { flex: 1; min-width: 0; }
  .adm-user-name { font-size: .95rem; font-weight: 700; color: #f1f5f9; }
  .adm-user-email { font-size: .76rem; color: #475569; margin-top: 2px; }
  .adm-status-badge {
    display: inline-flex; align-items: center; gap: .3rem;
    font-size: .7rem; font-weight: 700; padding: .25rem .6rem;
    border-radius: 6px; flex-shrink: 0;
  }
  .adm-status-ok   { background: rgba(16,185,129,0.12); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
  .adm-status-dis  { background: rgba(244,63,94,0.12);  color: #f43f5e; border: 1px solid rgba(244,63,94,0.3); }
  .adm-status-lock { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }

  .adm-user-stats {
    display: flex; gap: 1rem; margin: .6rem 0 .6rem 3.25rem;
    font-size: .76rem; color: #475569; flex-wrap: wrap;
  }
  .adm-user-stats b { color: #94a3b8; }

  .adm-perms { display: flex; gap: .4rem; flex-wrap: wrap; margin: .4rem 0 .75rem 3.25rem; }
  .adm-perm-chip {
    display: inline-flex; align-items: center; gap: .3rem;
    padding: .3rem .7rem; border-radius: 7px; font-size: .75rem; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(99,102,241,0.08);
    color: #94a3b8; cursor: pointer; transition: all .15s;
    user-select: none;
  }
  .adm-perm-chip.on { background: rgba(99,102,241,0.3); color: #f1f5f9; border-color: rgba(99,102,241,0.5); }
  .adm-perm-chip .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .adm-user-actions { display: flex; gap: .5rem; margin-left: 3.25rem; flex-wrap: wrap; }

  .adm-error { font-size: .82rem; color: #f43f5e; padding: 0 24px 4px; min-height: 1.2rem; }
  .adm-empty { text-align: center; padding: 3rem 1rem; color: #475569; font-size: .88rem; }

  /* Denied panel */
  .adm-denied-card {
    max-width: 360px; margin: 0 auto;
    background: rgba(244,63,94,0.06);
    border: 1px solid rgba(244,63,94,0.2);
    border-radius: 20px;
    padding: 2.5rem 2rem;
    text-align: center;
  }
  .adm-denied-icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: rgba(244,63,94,0.12);
    border: 1px solid rgba(244,63,94,0.25);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem;
  }

  @media (max-width: 640px) {
    .adm-stats { grid-template-columns: 1fr 1fr; }
    .adm-user-stats, .adm-perms, .adm-user-actions { margin-left: 0; }
  }
  @media (max-width: 380px) {
    .adm-stats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Aurora shimmer bar -->
<div style="position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;background:linear-gradient(90deg,#6366f1,#8b5cf6,#06b6d4,#10b981,#f59e0b,#f43f5e,#6366f1);background-size:300% 100%;animation:auroraShimmer 5s linear infinite"></div>

<div class="adm-shell">

  <!-- Header -->
  <div style="display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid rgba(99,102,241,0.12);background:rgba(10,12,20,0.88);backdrop-filter:blur(16px);position:sticky;top:3px;z-index:10">
    <div style="width:36px;height:36px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;display:grid;place-items:center;flex-shrink:0">
      <svg width="18" height="18" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <div>
      <h1 style="margin:0;font-size:16px;font-weight:700;color:#f1f5f9;letter-spacing:-.3px">แผงผู้ดูแลระบบ</h1>
      <p style="margin:0;font-size:12px;color:#94a3b8">TrackingTask Admin Panel</p>
    </div>
    <span style="margin-left:auto;background:rgba(244,63,94,0.15);color:#f43f5e;border:1px solid rgba(244,63,94,0.3);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.5px">ADMIN</span>
    <a href="index.html" style="display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.07);background:rgba(99,102,241,0.08);color:#94a3b8;font-size:.8rem;text-decoration:none;transition:all .15s;white-space:nowrap" onmouseover="this.style.borderColor='rgba(99,102,241,0.3)';this.style.color='#f1f5f9'" onmouseout="this.style.borderColor='rgba(255,255,255,0.07)';this.style.color='#94a3b8'">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      กลับหน้าหลัก
    </a>
  </div>

  <!-- Access denied -->
  <div id="adminDenied" style="display:none;flex:1;display:none;align-items:center;justify-content:center;padding:3rem 1.5rem">
    <div class="adm-denied-card">
      <div class="adm-denied-icon">
        <svg width="28" height="28" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      </div>
      <div style="font-size:1.05rem;font-weight:700;color:#f1f5f9;margin-bottom:.5rem">ไม่มีสิทธิ์เข้าถึงหน้านี้</div>
      <div style="font-size:.85rem;color:#94a3b8;margin-bottom:1.5rem">หน้านี้สำหรับ Super Admin เท่านั้น</div>
      <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:.875rem;font-weight:600;text-decoration:none">กลับหน้าหลัก</a>
    </div>
  </div>

  <!-- Main content -->
  <div id="adminContent" style="display:none;flex:1">

    <!-- Stats grid -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 24px 0" class="adm-stats" id="adminStatsGrid"></div>

    <!-- Error -->
    <div class="adm-error" id="adminError"></div>

    <!-- Toolbar -->
    <div class="adm-toolbar">
      <div class="adm-search-wrap">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="adm-search-input" id="adminSearchInput" placeholder="ค้นหาชื่อผู้ใช้หรืออีเมล…" oninput="adminSearch(this.value)">
      </div>
      <span id="adminSearchCount" style="font-size:.78rem;color:#94a3b8;white-space:nowrap"></span>
      <button onclick="loadAdminUsers()" style="display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.07);background:rgba(99,102,241,0.08);color:#94a3b8;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap" onmouseover="this.style.borderColor='rgba(99,102,241,0.3)';this.style.color='#f1f5f9'" onmouseout="this.style.borderColor='rgba(255,255,255,0.07)';this.style.color='#94a3b8'">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        รีเฟรช
      </button>
    </div>

    <!-- User list -->
    <div id="adminUserList" style="padding:0 24px 32px;display:flex;flex-direction:column;gap:8px"></div>

  </div>

</div>

<script src="js/admin.js?v=20260705-1"></script>
</body>
</html>
