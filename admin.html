<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Admin — TrackingTask</title>

<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  @keyframes auroraShimmer { 0%{background-position:0% 0%} 100%{background-position:300% 0%} }

  /* ── Admin-specific layout ── */
  .adm-content { flex: 1; overflow-y: auto; padding: 1.5rem; }
  @media (max-width: 768px) {
    .adm-content { padding-bottom: calc(1.5rem + 64px + env(safe-area-inset-bottom, 0px)); }
  }
  .adm-subheader { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.25rem; }
  .adm-panel-badge {
    background: rgba(16,185,129,0.15); color: #10b981;
    border: 1px solid rgba(16,185,129,0.3);
    border-radius: 8px; padding: 4px 10px;
    font-size: 12px; font-weight: 700; letter-spacing: .5px;
    flex-shrink: 0;
  }
  .adm-subheader-text { font-size: .88rem; color: var(--text-2); }

  /* Stats */
  .adm-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 1.25rem; }
  .adm-stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 1rem 1.1rem;
    display: flex; align-items: center; gap: .75rem;
    transition: border-color .2s;
  }
  .adm-stat:hover { border-color: var(--border-hover); }
  .adm-stat-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
  .adm-stat-num { font-size: 1.6rem; font-weight: 800; line-height: 1; color: var(--text); }
  .adm-stat-label { font-size: .72rem; color: var(--text-3); margin-top: 3px; text-transform: uppercase; letter-spacing: .5px; }

  /* Toolbar */
  .adm-toolbar { display: flex; align-items: center; gap: .6rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .adm-search-wrap {
    flex: 1; min-width: 200px;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px;
    transition: border-color .2s;
  }
  .adm-search-wrap:focus-within { border-color: rgba(99,102,241,0.45); }
  .adm-search-wrap svg { color: var(--text-3); flex-shrink: 0; }
  .adm-search-input { background: none; border: none; outline: none; color: var(--text); font-size: .85rem; width: 100%; font-family: var(--font, inherit); }
  .adm-search-input::placeholder { color: var(--text-3); }

  /* Filter chips */
  .adm-filter-chips { display: flex; gap: .4rem; }
  .adm-filter-chip {
    padding: .3rem .75rem; border-radius: 999px; font-size: .78rem; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-3);
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .adm-filter-chip:hover { border-color: var(--border-hover); color: var(--text-2); }
  .adm-filter-chip.active { background: rgba(99,102,241,.2); border-color: rgba(99,102,241,.5); color: #a5b4fc; }

  /* User grid */
  .adm-user-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* User card */
  .adm-user-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.1rem 1.2rem;
    display: flex; flex-direction: column; gap: .6rem;
    transition: border-color .2s;
  }
  .adm-user-card:hover { border-color: var(--border-hover); }

  .adm-user-top { display: flex; align-items: flex-start; gap: .75rem; }
  .adm-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 1rem; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }
  .adm-user-info { flex: 1; min-width: 0; }
  .adm-user-name { font-size: .95rem; font-weight: 700; color: var(--text); }
  .adm-user-email { font-size: .76rem; color: var(--text-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Status badges */
  .adm-status-badge {
    display: inline-flex; align-items: center; gap: .3rem;
    font-size: .7rem; font-weight: 700; padding: .25rem .6rem;
    border-radius: 6px; flex-shrink: 0; white-space: nowrap;
  }
  .adm-status-ok   { background: rgba(16,185,129,0.12); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
  .adm-status-dis  { background: rgba(148,163,184,0.1);  color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
  .adm-status-lock { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }

  /* Permission chips */
  .adm-perm-row { display: flex; gap: .4rem; flex-wrap: wrap; }
  .adm-perm-chip {
    padding: .25rem .6rem; border-radius: 6px; font-size: .73rem; font-weight: 600;
    cursor: pointer; border: 1px solid transparent; transition: all .15s; user-select: none;
  }
  .adm-perm-chip.on.task    { background: rgba(59,130,246,.18); color: #60a5fa; border-color: rgba(59,130,246,.3); }
  .adm-perm-chip.on.tool    { background: rgba(20,184,166,.18); color: #2dd4bf; border-color: rgba(20,184,166,.3); }
  .adm-perm-chip.on.finance { background: rgba(139,92,246,.18); color: #c4b5fd; border-color: rgba(139,92,246,.3); }
  .adm-perm-chip.on.admin-chip { background: rgba(244,63,94,.18); color: #fb7185; border-color: rgba(244,63,94,.3); }
  .adm-perm-chip.off { background: var(--surface2); color: var(--text-3); border-color: var(--border); }

  .adm-last-login { font-size: .74rem; color: var(--text-3); }

  .adm-warn-banner {
    background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.25);
    border-radius: 8px; padding: .4rem .75rem; font-size: .76rem; color: #f59e0b;
  }

  .adm-actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .25rem; }
  .adm-btn {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .4rem .85rem; border-radius: 9px; font-size: .78rem; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text-2); transition: all .15s; flex: 1; justify-content: center;
    font-family: var(--font, inherit);
  }
  .adm-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .adm-btn.danger:hover  { background: rgba(244,63,94,.12); border-color: rgba(244,63,94,.3); color: #f43f5e; }
  .adm-btn.success:hover { background: rgba(16,185,129,.12); border-color: rgba(16,185,129,.3); color: #10b981; }
  .adm-btn.warn:hover    { background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.3); color: #f59e0b; }

  .adm-empty { text-align: center; padding: 3rem; color: var(--text-3); font-size: .88rem; }
  .adm-error { font-size: .82rem; color: #f43f5e; margin-bottom: .5rem; min-height: 1.2rem; }

  /* Access denied */
  .adm-denied-card {
    max-width: 360px; margin: 0 auto;
    background: rgba(244,63,94,0.06); border: 1px solid rgba(244,63,94,0.2);
    border-radius: 20px; padding: 2.5rem 2rem; text-align: center;
  }
  .adm-denied-icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: rgba(244,63,94,0.12); border: 1px solid rgba(244,63,94,0.25);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem;
  }

  /* Mobile topbar (visible <769px, hidden on desktop) */
  .adm-mobile-topbar {
    display: none;
    align-items: center;
    gap: .5rem;
    padding: .7rem 1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 3px; z-index: 50;
  }

  @media (max-width: 768px) {
    .adm-mobile-topbar { display: flex; }
    .adm-stats { grid-template-columns: 1fr 1fr; }
    .adm-user-grid { grid-template-columns: 1fr; }
    .adm-content { padding: 1rem; }
  }
  @media (max-width: 640px) {
    .adm-filter-chips { flex-wrap: wrap; }
  }
  @media (max-width: 380px) {
    .adm-stats { grid-template-columns: 1fr; }
  }

  /* Desktop topbar */
  .adm-topbar {
    display: flex; align-items: center; gap: .75rem;
    padding: .7rem 1.25rem;
    background: rgba(10,12,20,0.88);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 3px; z-index: 50;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- Aurora shimmer bar -->
<div style="position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;background:linear-gradient(90deg,#6366f1,#8b5cf6,#06b6d4,#10b981,#f59e0b,#f43f5e,#6366f1);background-size:300% 100%;animation:auroraShimmer 5s linear infinite"></div>

<div class="app-shell" style="display:flex;height:100vh;overflow:hidden;padding-top:3px">

    <!-- Nav -->

        </span>

        <span class="sb-item-label">Admin</span>
