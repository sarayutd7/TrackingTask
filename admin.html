<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrackingTask — Admin</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css?v=20260708">
  <style>
    body{margin:0;background:#0f1117;color:#f1f5f9;font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh}
    .admin-wrap{max-width:1000px;margin:0 auto;padding:24px}
    .rainbow-strip{height:3px;position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(90deg,#6366f1,#8b5cf6,#06b6d4,#10b981,#f59e0b,#f43f5e,#6366f1);background-size:200% 100%;animation:strip-slide 4s linear infinite}
    @keyframes strip-slide{to{background-position:-200% 0}}
    .admin-header{display:flex;align-items:center;gap:12px;padding:20px 0 20px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:24px;margin-top:12px}
    .admin-logo{width:36px;height:36px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;display:grid;place-items:center;flex-shrink:0}
    .admin-title{font-size:18px;font-weight:700;color:#f1f5f9;letter-spacing:-.3px}
    .admin-badge{margin-left:auto;background:rgba(244,63,94,.15);color:#f43f5e;border:1px solid rgba(244,63,94,.3);border-radius:8px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:.5px}
    .admin-stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
    .admin-stat{background:#1a1d2e;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;transition:border-color .2s}
    .admin-stat:hover{border-color:rgba(255,255,255,.13)}
    .admin-stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .admin-stat-num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:#f1f5f9}
    .admin-stat-label{font-size:11px;color:#475569;margin-top:2px}
    .admin-toolbar{display:flex;gap:10px;margin-bottom:18px;align-items:center}
    .admin-search{flex:1;background:#1a1d2e;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:9px 14px;color:#f1f5f9;font-size:13px;outline:none;transition:border-color .2s}
    .admin-search:focus{border-color:rgba(99,102,241,.4)}
    .admin-search::placeholder{color:#475569}
    .user-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .user-card{background:#1a1d2e;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px;transition:border-color .2s}
    .user-card:hover{border-color:rgba(255,255,255,.13)}
    .user-card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
    .user-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
    .user-name{font-size:14px;font-weight:700;color:#f1f5f9}
    .user-email{font-size:11px;color:#475569;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
    .user-status{margin-left:auto;font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;flex-shrink:0}
    .status-active{background:linear-gradient(135deg,rgba(16,185,129,.25),rgba(5,150,105,.15));color:#34d399;border:1px solid rgba(16,185,129,.2)}
    .status-locked{background:linear-gradient(135deg,rgba(245,158,11,.25),rgba(249,115,22,.15));color:#fbbf24;border:1px solid rgba(245,158,11,.2)}
    .status-disabled{background:linear-gradient(135deg,rgba(244,63,94,.2),rgba(239,68,68,.12));color:#fb7185;border:1px solid rgba(244,63,94,.2)}
    .perm-row{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
    .perm-chip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;background:#252840;border:1px solid rgba(255,255,255,.07);color:#475569;cursor:pointer;transition:all .15s;user-select:none}
    .perm-chip.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;color:#fff}
    .user-actions{display:flex;gap:6px}
    .ua-btn{flex:1;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:600;background:#1f2235;border:1px solid rgba(255,255,255,.07);color:#94a3b8;cursor:pointer;transition:all .15s}
    .ua-btn:hover{border-color:rgba(255,255,255,.13);color:#f1f5f9}
    .ua-btn.danger:hover{border-color:rgba(244,63,94,.4);color:#fb7185}
    .ua-btn.warn:hover{border-color:rgba(245,158,11,.4);color:#fbbf24}
    #adminError{color:#fb7185;font-size:13px;margin-bottom:12px;min-height:20px}
    #adminSearchCount{font-size:12px;color:#475569;white-space:nowrap}
    #adminDenied{display:none;text-align:center;padding:60px;color:#94a3b8}
    .adm-empty{text-align:center;padding:3rem 1rem;color:#475569;font-size:.88rem}
    @media(max-width:640px){.admin-stat-row{grid-template-columns:1fr 1fr}.user-grid{grid-template-columns:1fr}}
    @media(max-width:380px){.admin-stat-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="rainbow-strip"></div>
  <div class="admin-wrap">
    <div class="admin-header">
      <div class="admin-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div>
        <div class="admin-title">แผงผู้ดูแลระบบ</div>
        <div style="font-size:12px;color:#475569">TrackingTask Admin</div>
      </div>
      <span class="admin-badge">ADMIN</span>
      <a href="index.html" style="font-size:12px;color:#6366f1;margin-left:12px;text-decoration:none">← กลับแอป</a>
    </div>

    <div id="adminContent" style="display:none">
      <div id="adminStatsGrid" class="admin-stat-row"></div>
      <div id="adminError"></div>
      <div class="admin-toolbar">
        <input class="admin-search" type="text" id="adminSearchInput" placeholder="ค้นหาผู้ใช้..." oninput="adminSearch(this.value)">
        <span id="adminSearchCount"></span>
        <button onclick="loadAdminUsers()" style="padding:9px 16px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap">รีเฟรช</button>
      </div>
      <div id="adminUserList" class="user-grid"></div>
    </div>

    <div id="adminDenied">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      <p style="margin-top:16px;font-size:16px;font-weight:600;color:#f43f5e">ไม่มีสิทธิ์เข้าถึง</p>
      <p style="font-size:13px;color:#475569;margin-top:8px">เฉพาะผู้ดูแลระบบเท่านั้น</p>
      <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:.875rem;font-weight:600;text-decoration:none;margin-top:20px">กลับหน้าหลัก</a>
    </div>
  </div>
  <script src="js/admin.js?v=20260708"></script>
</body>
</html>
